<h3>题目名称：计算器</h3>
<p>题目来源：Bugku CTF</p >
<p>题目类别：web</p >
<p>题目描述：随机显示一道计算题输入正确答案可以获得flag，但是输入有限制只能输入一位。</p >

<h3>解题思路</h3>
<p>发现输入只能输入一位数字后，觉得应该是被限制输入。</p >

<h3>详细步骤</h3>
<ol>
  <li>1.f12打开源代码</li>
  <li>2.找到maxlength="1"</li>
  <li>3.修改1至3</li>
  <li>4.输入正确答案获得flag</li>
</ol>

<h3>Payload</h3>
<p>前端绕过：将 HTML 代码中的 maxlength="1" 修改为 maxlength="3" （或直接删除）</p >
